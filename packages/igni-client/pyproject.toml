[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igni-client"
version = "0.1.0"
description = "Drive an igni from your own code: connect headlessly to a person's, an app's or a space's igni — in Fleet or on this machine — and run sessions, prompts, approvals and commands there."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Ignite Ember" }]
keywords = ["igni", "client", "agent", "sdk", "fleet", "air-gapped"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # The gateway's commands and identity, igni server's token endpoint
    # and an app's spaces.
    "httpx>=0.28.1",
    # igni's own socket, locally and through the Fleet gateway.
    "websockets>=15,<17",
    "pydantic>=2.11",
    # An app signs in as itself with a `private_key_jwt` assertion.
    "pyjwt[crypto]>=2.10",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/ignite-ember/igni-sdk"
Documentation = "https://ignite-ember.sh/docs/sdk/igni-client"
Source = "https://github.com/ignite-ember/igni-sdk/tree/main/packages/igni-client"
Issues = "https://github.com/ignite-ember/igni-sdk/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igni_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["igni_client", "tests"]
