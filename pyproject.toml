# The repository's own tooling: the host-model generator, the contract
# copies, and the tests that hold the SDKs to them. Not a package — each
# SDK under packages/ is one, with its own pyproject and environment.
[project]
name = "igni-sdk-repo"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pydantic>=2.11",
    "pytest>=8.3",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "ruff>=0.15",
    # Scores the RustSec vectors in scripts/dependency_audit.py.
    "cvss>=3,<4",
    "mypy>=2.0",
    # The SDKs themselves, from this checkout: the generator's tests import
    # what it wrote, and the docs run against them.
    "igni-extension",
    "igni-service",
]

[tool.uv]
package = false

[tool.uv.sources]
igni-extension = { path = "packages/igni-extension", editable = true }
igni-service = { path = "packages/igni-service", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests", "tools", "scripts"]
extend-exclude = ["packages", "examples", "node_modules"]

[tool.ruff.lint]
# ``S`` is flake8-bandit (security lint), as in every SDK's pyproject.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
